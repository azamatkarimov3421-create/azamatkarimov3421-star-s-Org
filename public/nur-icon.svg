<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="111" fill="none" stroke="#f59e0b" stroke-width="4" opacity="0.4" />

  <!-- Sun rays -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <g stroke="url(#goldGrad)" stroke-width="12" stroke-linecap="round" opacity="0.85">
      <line x1="0" y1="-175" x2="0" y2="-215" />
      <line x1="123.7" y1="-123.7" x2="152" y2="-152" />
      <line x1="175" y1="0" x2="215" y2="0" />
      <line x1="123.7" y1="123.7" x2="152" y2="152" />
      <line x1="0" y1="175" x2="0" y2="215" />
      <line x1="-123.7" y1="123.7" x2="-152" y2="152" />
      <line x1="-175" y1="0" x2="-215" y2="0" />
      <line x1="-123.7" y1="-123.7" x2="-152" y2="-152" />
    </g>

    <!-- Sun Disc -->
    <circle r="140" fill="url(#goldGrad)" />
    <circle r="126" fill="#0f172a" />

    <!-- Crown & Nr Symbol in Center -->
    <path d="M-60,-25 L-40,40 L40,40 L60,-25 L25,10 L0,-45 L-25,10 Z" fill="url(#goldGrad)" />
    <circle cx="-60" cy="-30" r="9" fill="#fef08a" />
    <circle cx="0" cy="-52" r="11" fill="#fef08a" />
    <circle cx="60" cy="-30" r="9" fill="#fef08a" />

    <!-- Text 100 -->
    <text x="0" y="95" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="52" fill="url(#goldGrad)" letter-spacing="4">
      100
    </text>
  </g>
</svg>
